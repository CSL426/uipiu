# 對外唯一入口：同一個 nginx 送前端靜態檔，也把 API 轉給後端。

# ngrok / Cloudflare Tunnel 等前置 TLS 終端會帶 X-Forwarded-Proto: https；
# 沿用它，否則後端以為自己是 http，比對 Origin 時會把自己的請求當跨站擋掉
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 後端位址放變數並交給 Docker DNS 解析：寫死的話 nginx 啟動時只解析一次，
    # 後端容器重建換 IP 後會一直回 502，也會讓後端沒起來時整個前端都起不來
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://nidin-menu-parser:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # 用 $remote_addr 覆寫、不附加：後端以它判斷來源 IP 做登入與送單限流，
    # 附加用戶端自帶的值等於讓人偽造 IP 繞過限流
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    location = /health {
        proxy_pass $backend;
    }

    location /api/ {
        # proxy_pass 用變數時 nginx 不會自動換掉 location 前綴，要自己去掉 /api
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    location /menus/ {
        proxy_pass $backend;
    }

    location /guest/ {
        proxy_pass $backend;
    }

    location /resolve-store {
        proxy_pass $backend;
    }

    location /parse-order {
        proxy_pass $backend;
    }

    # 外部 agent 的 MCP（streamable HTTP）。路徑原樣轉給後端；不緩衝，SSE 回應才不會卡住
    location = /mcp {
        proxy_pass $backend;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
